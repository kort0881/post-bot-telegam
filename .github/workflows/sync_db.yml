name: Sync database

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # нужен полный history, чтобы rebase/pull работали предсказуемо
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Слияние баз сервер ↔ репозиторий
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
        run: |
          pip install --quiet paramiko
          python tools/remote_sync.py
      - name: Коммит изменений базы
        run: |
          if [[ -z "$(git status --porcelain posted_articles.db)" ]]; then
            echo "база не изменилась"
            exit 0
          fi

          git config user.name "post-bot"
          git config user.email "post-bot@users.noreply.github.com"
          git add posted_articles.db
          git commit -m "🗂 Sync database from server [skip ci]"

          # Пытаемся подтянуть main; если случился конфликт бинарника —
          # берём нашу свежую версию БД (с сервера) и корректно завершаем rebase
          if ! git pull --rebase --quiet origin main; then
            echo "::warning::Конфликт при rebase, берём версию БД с сервера"
            git checkout --theirs posted_articles.db || true
            git add posted_articles.db
            GIT_EDITOR=true git rebase --continue || git rebase --skip
          fi

          # HEAD:main спасает от detached HEAD после rebase
          git push origin HEAD:main
