name: Collect post metrics

on:
  schedule:
    - cron: '12 * * * *'   # каждый час: окна 1ч/6ч/24ч
  workflow_dispatch:

permissions:
  contents: read

# Общая очередь с постером и бэкапом: база на сервере не терпит двух писателей.
concurrency:
  group: post-bot-db
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt

      - name: "База: снапшот с сервера"
        id: dbpull
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
        run: python tools/db_sync.py pull

      - name: Collect metrics
        if: steps.dbpull.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: python tools/collect_stats.py

      - name: "База: заливка на сервер"
        if: always() && steps.dbpull.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
        run: python tools/db_sync.py push
