name: Telegram AI Tech Bot

on:
  schedule:
    # 07-11-26: раньше было '0 6,10,14,18 * * *'. GitHub на круглых минутах
    # задерживает и ВЫБРАСЫВАЕТ запуски: 07.11 не было ни одного прогона за сутки,
    # 06.11 — два из четырёх, 05.11 — два. Канал оставался без постов.
    # Теперь тик каждый час на нечётной минуте, а сколько постов за день —
    # решает гейт по слотам 06/10/14/18 UTC (МСК 09/13/17/21): пропущенный
    # слот закрывается следующим тиком, лишних постов не будет.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-bot
  cancel-in-progress: false

jobs:
  post_news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Гейт расписания
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime, os, sqlite3
          SLOTS = [6, 10, 14, 18]          # UTC, как в прежнем cron
          now = datetime.datetime.now(datetime.timezone.utc)
          due = sum(1 for h in SLOTS if now.hour >= h)
          have = 0
          if os.path.exists("posted_articles.db"):
              c = sqlite3.connect("posted_articles.db")
              have = c.execute(
                  "select count(*) from posted_articles where date(posted_date) = ?",
                  (now.strftime("%Y-%m-%d"),),
              ).fetchone()[0]
          manual = os.environ.get("EVENT_NAME") == "workflow_dispatch"
          run = 1 if (manual or have < due) else 0
          print(f"UTC {now:%Y-%m-%d %H:%M} | слотов прошло {due}/4 | "
                f"постов за сегодня {have} | ручной запуск {manual} | запускать {run}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run={run}\n")
          PY

      - name: Setup Python
        if: steps.gate.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.gate.outputs.run == '1'
        run: pip install -r requirements.txt

      - name: Debug - before
        if: steps.gate.outputs.run == '1'
        run: |
          echo "📂 До запуска:"
          ls -la *.db 2>/dev/null || echo "БД не существует"
          if [ -f posted_articles.db ]; then
            sqlite3 posted_articles.db "SELECT COUNT(*) || ' записей в БД' FROM posted_articles;" 2>/dev/null || echo "Таблица пуста"
          fi

      - name: Run bot
        if: steps.gate.outputs.run == '1'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python telegrambot.py

      - name: Debug - after
        if: steps.gate.outputs.run == '1'
        run: |
          echo "📂 После запуска:"
          ls -la *.db 2>/dev/null || echo "БД не существует"
          if [ -f posted_articles.db ]; then
            echo "=== Последние 5 записей ==="
            sqlite3 posted_articles.db "SELECT id, substr(title,1,50) || '...', posted_date FROM posted_articles ORDER BY id DESC LIMIT 5;"
            echo "=== Всего записей ==="
            sqlite3 posted_articles.db "SELECT COUNT(*) FROM posted_articles;"
          fi

      - name: Commit state
        if: steps.gate.outputs.run == '1'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add posted_articles.db 2>/dev/null || true
          git add ai_poster.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🤖 Update database [skip ci]"
          git push || (git pull --rebase && git push)
