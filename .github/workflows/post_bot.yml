name: Telegram AI Tech Bot

on:
  # 07-11-26: GitHub-расписание убрано совсем — после правки cron плановые тики
  # (11:07 и 12:07 UTC) не запустились ни разу, а раньше запуски терялись пачками.
  # Внешний cron на DE дёргает этот workflow каждый час в :07 с mode=tick.
  workflow_dispatch:
    inputs:
      mode:
        description: "tick = плановый запуск (гейт слотов), manual = публиковать сразу"
        required: false
        default: "manual"

permissions:
  contents: read

# Одна очередь на всё, что трогает базу: постер, метрики, бэкап.
concurrency:
  group: post-bot-db
  cancel-in-progress: false

jobs:
  post_news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      # Свежая база нужна ДО гейта: иначе гейт считает посты по устаревшему
      # снапшоту в git (он обновляется раз в сутки бэкапом) и пропускает лишние тики.
      - name: "База: снапшот с сервера"
        id: dbpull
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
        run: python tools/db_sync.py pull

      - name: Гейт расписания
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          # 26.11.2026: бронь поста. Значение — ISO-время в UTC (одно или JSON-список).
          # В течение QUIET_MIN минут после брони постер молчит, даже если бронь ставили руками.
          RESERVED_AT_UTC: ${{ vars.RESERVED_AT_UTC }}
          QUIET_MIN: "60"
        # Логика в tools/gate.py: считает только живые посты (deleted_at пустой),
        # держит паузу MIN_GAP_HOURS и окно тишины после брони. Покрыта tests/test_gate.py.
        run: python tools/gate.py

      - name: Debug - before
        if: steps.gate.outputs.run == '1' && steps.dbpull.outcome == 'success'
        run: |
          echo "📂 До запуска:"
          ls -la *.db 2>/dev/null || echo "БД не существует"
          if [ -f posted_articles.db ]; then
            sqlite3 posted_articles.db "SELECT COUNT(*) || ' записей в БД' FROM posted_articles;" 2>/dev/null || echo "Таблица пуста"
          fi

      # Без свежей базы с сервера не публикуем: пропущенный слот лучше дубля.
      - name: Run bot
        if: steps.gate.outputs.run == '1' && steps.dbpull.outcome == 'success'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          # 19.11.2026 по слову владельца: опросы выключены (повторялись вопросы),
          # викторина остаётся раз в 5 дней.
          POLLS_ENABLED: "0"
          QUIZZES_ENABLED: "1"
          POLL_EVERY_DAYS: "3"
          QUIZ_EVERY_DAYS: "5"
          POLL_DAILY_LIMIT: "1"
          # 23.11.2026: цель — 5 постов в сутки. Кулдауны ослаблены по порядку из
          # рунбука (окно 72→48ч, субъект 1→2), плюс снят потолок «один и тот же
          # раздел два поста подряд», из-за которого ИИ-новости резались как
          # TOPIC_IN_ROW (general) сразу после первых двух постов дня.
          ENTITY_COOLDOWN_HOURS: "48"
          ENTITY_MAX_POSTS: "2"
          STORY_RULE_HOURS: "48"
          MAX_SAME_TOPIC_IN_ROW: "3"
        run: python telegrambot.py

      - name: Debug - after
        if: always() && steps.gate.outputs.run == '1'
        run: |
          echo "📂 После запуска:"
          ls -la *.db 2>/dev/null || echo "БД не существует"
          if [ -f posted_articles.db ]; then
            echo "=== Последние 5 записей ==="
            sqlite3 posted_articles.db "SELECT id, substr(title,1,50) || '...', posted_date FROM posted_articles ORDER BY id DESC LIMIT 5;"
            echo "=== Всего записей ==="
            sqlite3 posted_articles.db "SELECT COUNT(*) FROM posted_articles;"
          fi

      # Заливаем даже при падении бота: пост мог уйти в канал, и запись о нём
      # обязана оказаться на сервере, иначе следующий тик опубликует его снова.
      - name: "База: заливка на сервер"
        if: always() && steps.gate.outputs.run == '1' && steps.dbpull.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
        run: python tools/db_sync.py push

      - name: Сохранить базу при падении
        if: failure() && steps.gate.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: posted_articles-db-${{ github.run_id }}
          path: posted_articles.db
          retention-days: 14
          if-no-files-found: ignore
