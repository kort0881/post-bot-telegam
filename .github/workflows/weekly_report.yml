name: Weekly report

on:
  schedule:
    - cron: '5 6 * * 1'   # понедельник, 09:05 МСК
  workflow_dispatch:

permissions:
  contents: write

# Та же очередь, что у постера и метрик: база на сервере — единственный писатель.
concurrency:
  group: post-bot-db
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt

      - name: "База: снапшот с сервера"
        id: dbpull
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
        run: python tools/db_sync.py pull

      - name: Build report
        if: steps.dbpull.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python tools/weekly_report.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: docs/reports/*.txt
          retention-days: 60

      # В git едет только текст отчёта. База — нет: её дом на сервере,
      # бинарник в репозитории и был источником конфликтов.
      - name: Commit report
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/reports 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📊 Weekly report [skip ci]"
          git push || (git pull --rebase --quiet && git push)
