name: Collect post metrics

on:
  schedule:
    - cron: '12 * * * *'   # каждый час: окна 1ч/6ч/24ч
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Collect metrics
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
        run: python tools/collect_stats.py
      - name: Commit state
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add posted_articles.db 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📊 Update post metrics [skip ci]"
          git push || (git pull --rebase && git push)
