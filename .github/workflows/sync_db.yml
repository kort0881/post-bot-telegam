name: Sync database

# Это бэкап, а не синхронизация: в git база едет только на чтение.
# Пишет базу только сервер. Пока источником правды был ещё и репозиторий,
# конфликт бинарника съедал записи об опубликованных постах и они выходили дважды.
on:
  schedule:
    - cron: '26 3 * * *'   # раз в сутки, вне часов публикации
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-bot-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Снапшот сервера в файл репозитория
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
        run: python tools/db_sync.py backup

      - name: Коммит бэкапа
        run: |
          if [[ -z "$(git status --porcelain posted_articles.db)" ]]; then
            echo "база не изменилась"
            exit 0
          fi

          git config user.name "post-bot"
          git config user.email "post-bot@users.noreply.github.com"
          git add posted_articles.db
          git commit -m "🗂 Backup database snapshot [skip ci]"

          # если main уехал вперёд — не реплеим коммит по бинарнику, а
          # пересобираем бэкап заново от origin: источник правды на сервере
          if ! git push --quiet origin HEAD:main; then
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            python tools/db_sync.py backup
            git add posted_articles.db
            git commit -m "🗂 Backup database snapshot [skip ci]" || true
            git push --quiet origin HEAD:main
          fi
