name: "Канал: служебные действия (кто постит / удалить пост)"
on:
  workflow_dispatch:
    inputs:
      action:
        description: "getme | delete"
        required: true
        default: "getme"
      message_ids:
        description: "id сообщений через запятую (для delete)"
        required: false
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ github.event.inputs.action == 'delete' && github.event.inputs.message_ids != '' }}
        uses: actions/checkout@v4

      - name: Setup Python
        if: ${{ github.event.inputs.action == 'delete' && github.event.inputs.message_ids != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        if: ${{ github.event.inputs.action == 'delete' && github.event.inputs.message_ids != '' }}
        run: pip install paramiko

      - name: Call Telegram API
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL_ID }}
          ACTION: ${{ github.event.inputs.action }}
          IDS: ${{ github.event.inputs.message_ids }}
        run: |
          CHANNEL=$(printf '%s' "$CHANNEL" | tr -d '[:space:]')
          echo "== getMe"
          curl -s "https://api.telegram.org/bot$TOKEN/getMe" | head -c 300; echo
          echo "== CHANNEL_LEN=${#CHANNEL}"
          echo "== getChat (raw)"
          curl -s "https://api.telegram.org/bot$TOKEN/getChat?chat_id=$CHANNEL" | head -c 400; echo
          if [ "$ACTION" = "delete" ]; then
            IFS=',' read -ra ARR <<< "$IDS"
            for m in "${ARR[@]}"; do
              m=$(echo "$m" | tr -d ' ')
              [ -z "$m" ] && continue
              echo "== delete $m"
              curl -s -X POST "https://api.telegram.org/bot$TOKEN/deleteMessage" -d "chat_id=$CHANNEL" -d "message_id=$m" | head -c 300; echo
            done
          fi
      # 26.11.2026: удалённый пост помечается deleted_at, иначе гейт считает его вышедшим
      # и до конца суток не пускает новые (случай 23.11: 5/5 при двух удалённых).
      - name: "Пометить удалённые в базе"
        if: ${{ github.event.inputs.action == 'delete' && github.event.inputs.message_ids != '' }}
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
          IDS: ${{ github.event.inputs.message_ids }}
        run: python tools/mark_deleted.py "$IDS"
