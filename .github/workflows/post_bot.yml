name: Telegram AI Tech Bot

on:
  # 07-11-26: GitHub-расписание убрано совсем — после правки cron плановые тики
  # (11:07 и 12:07 UTC) не запустились ни разу, а раньше запуски терялись пачками.
  # Внешний cron на DE дёргает этот workflow каждый час в :07 с mode=tick.
  workflow_dispatch:
    inputs:
      mode:
        description: "tick = плановый запуск (гейт слотов), manual = публиковать сразу"
        required: false
        default: "manual"

permissions:
  contents: read

# Одна очередь на всё, что трогает базу: постер, метрики, бэкап.
concurrency:
  group: post-bot-db
  cancel-in-progress: false

jobs:
  post_news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Гейт расписания
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          python3 - <<'PY'
          import datetime, os, sqlite3
          SLOTS = [6, 10, 14, 18]          # UTC, как в прежнем cron
          now = datetime.datetime.now(datetime.timezone.utc)
          due = sum(1 for h in SLOTS if now.hour >= h)
          have = 0
          if os.path.exists("posted_articles.db"):
              c = sqlite3.connect("posted_articles.db")
              have = c.execute(
                  "select count(*) from posted_articles where date(posted_date) = ?",
                  (now.strftime("%Y-%m-%d"),),
              ).fetchone()[0]
          # ручной запуск публикует сразу, плановый тик (mode=tick) проходит гейт
          manual = (os.environ.get("EVENT_NAME") == "workflow_dispatch"
                    and os.environ.get("INPUT_MODE", "manual") != "tick")
          run = 1 if (manual or have < due) else 0
          print(f"UTC {now:%Y-%m-%d %H:%M} | слотов прошло {due}/4 | "
                f"постов за сегодня {have} | ручной запуск {manual} | запускать {run}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run={run}\n")
          PY

      - name: Setup Python
        if: steps.gate.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.gate.outputs.run == '1'
        run: pip install -r requirements.txt

      # База живёт на сервере и только там меняется. Раннер её не коммитит:
      # конфликт бинарника в git и был причиной повторных публикаций.
      - name: "База: снапшот с сервера"
        id: dbpull
        if: steps.gate.outputs.run == '1'
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
        run: python tools/db_sync.py pull

      - name: Debug - before
        if: steps.gate.outputs.run == '1' && steps.dbpull.outcome == 'success'
        run: |
          echo "📂 До запуска:"
          ls -la *.db 2>/dev/null || echo "БД не существует"
          if [ -f posted_articles.db ]; then
            sqlite3 posted_articles.db "SELECT COUNT(*) || ' записей в БД' FROM posted_articles;" 2>/dev/null || echo "Таблица пуста"
          fi

      # Без свежей базы с сервера не публикуем: пропущенный слот лучше дубля.
      - name: Run bot
        if: steps.gate.outputs.run == '1' && steps.dbpull.outcome == 'success'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python telegrambot.py

      - name: Debug - after
        if: always() && steps.gate.outputs.run == '1'
        run: |
          echo "📂 После запуска:"
          ls -la *.db 2>/dev/null || echo "БД не существует"
          if [ -f posted_articles.db ]; then
            echo "=== Последние 5 записей ==="
            sqlite3 posted_articles.db "SELECT id, substr(title,1,50) || '...', posted_date FROM posted_articles ORDER BY id DESC LIMIT 5;"
            echo "=== Всего записей ==="
            sqlite3 posted_articles.db "SELECT COUNT(*) FROM posted_articles;"
          fi

      # Заливаем даже при падении бота: пост мог уйти в канал, и запись о нём
      # обязана оказаться на сервере, иначе следующий тик опубликует его снова.
      - name: "База: заливка на сервер"
        if: always() && steps.gate.outputs.run == '1' && steps.dbpull.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          TARGET_DIR: /opt/post-bot
        run: python tools/db_sync.py push

      - name: Сохранить базу при падении
        if: failure() && steps.gate.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: posted_articles-db-${{ github.run_id }}
          path: posted_articles.db
          retention-days: 14
          if-no-files-found: ignore
