name: Examples (без публикации)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate examples (no publishing)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MAX_GENERATION_ATTEMPTS: "12"
          MAX_EXTRACTIONS: "6"
        run: python tools/generate_examples.py

      - name: Upload examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examples
          path: |
            docs/examples/*.md
            docs/examples/*.json
            block_ai_poster.log
          retention-days: 14
